<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{assunto}}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#FAF8F5;-webkit-text-size-adjust:100%;">
    <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{previa}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FAF8F5;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
            <tr>
              <td style="padding:0 4px 16px 4px;font-family:'Syne','Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:24px;line-height:1;font-weight:700;letter-spacing:-0.5px;color:#17191C;">
                <a href="{{linkSite}}" style="color:#17191C;text-decoration:none;">vera<span style="color:#D96C2F;">.</span><span style="color:#4A4F55;">finance</span></a>
              </td>
            </tr>
            <tr>
              <td style="background-color:#FFFFFF;border:1px solid #E5E1DA;border-radius:16px;padding:28px 24px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#17191C;">
{{conteudo}}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 4px 0 4px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#6B7075;">
                <p style="margin:0 0 8px 0;">Dúvidas? Escreva para <a href="mailto:{{emailAjuda}}" style="color:#A84D14;">{{emailAjuda}}</a>.</p>
                <p style="margin:0 0 8px 0;">{{rodape}}</p>
                <p style="margin:0;">A vera nunca pede a senha do seu banco nem os dados do seu cartão por e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
