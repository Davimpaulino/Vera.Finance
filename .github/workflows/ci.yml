# Confere cada push e pull request: testes do backend, testes e build do frontend.
# Os testes de ponta a ponta (Frontend: npm run test:e2e) rodam só na máquina de quem desenvolve.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, como o Backend. O npm ci mostra avisos EBADENGINE porque os pacotes do
          # firebase 13 pedem Node 24.12 ou mais: é esperado e não quebra nada, porque o SDK roda
          # no navegador e aqui o Node só testa e empacota. Não ligue engine-strict neste job.
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
