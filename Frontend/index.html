<!doctype html>
<html lang="pt-BR" data-theme="tinta">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C0E10" />
    <title>vera.finance · controle de gastos e comparador de preços de supermercado</title>
    <meta
      name="description"
      content="Organize a renda por categorias, saiba até que dia o dinheiro dura e compare o preço da sua lista de compras nos supermercados perto de você. Grátis."
    />
    <meta name="robots" content="index, follow" />
    <!-- O endereço do site entra no build a partir de VITE_SITE_URL (vite.config.js). -->
    <!-- Canonical e og:url são definidos por página em src/App.jsx. Sem pré-renderização,
         um valor fixo aqui marcaria as outras rotas como cópias da home. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="vera.finance" />
    <meta property="og:title" content="vera.finance · saiba até que dia o dinheiro dura" />
    <meta
      property="og:description"
      content="Controle de gastos por categoria e comparador de preços de supermercado pelo seu CEP."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="vera.finance: descubra onde a sua lista de compras sai mais barata"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="vera.finance · saiba até que dia o dinheiro dura" />
    <meta
      name="twitter:description"
      content="Controle de gastos por categoria e comparador de preços de supermercado pelo seu CEP."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "vera.finance",
        "url": "__SITE_URL__/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt-BR",
        "description": "Controle de gastos por categoria, metas e comparador de preços de supermercado pelo CEP.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "vera.finance",
        "url": "__SITE_URL__/",
        "logo": "__SITE_URL__/icons/icon-512.png",
        "description": "App brasileiro de finanças pessoais: controle de gastos por categoria, metas e comparação de preços de supermercado pelo CEP, com preços dos sites das redes e de notas fiscais.",
        "email": "oi@vera.finance"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>vera.finance</h1>
      <p>
        Controle de gastos por categoria, metas e comparador de preços de supermercado pelo seu
        CEP. Ative o JavaScript para usar o app.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
